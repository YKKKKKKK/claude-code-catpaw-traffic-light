name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app
        run: |
          pyinstaller \
            --name "PawSignal" \
            --windowed \
            --noconfirm \
            --clean \
            --icon "traffic_light.icns" \
            traffic_light.py

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create DMG
        run: |
          hdiutil create -volname "PawSignal" \
            -srcfolder dist/PawSignal.app \
            -ov -format UDZO \
            dist/PawSignal-${{ steps.version.outputs.version }}.dmg

      - name: Zip app
        run: cd dist && zip -r PawSignal.app.zip PawSignal.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PawSignal-${{ steps.version.outputs.version }}
          path: |
            dist/PawSignal.app.zip
            dist/PawSignal-${{ steps.version.outputs.version }}.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: PawSignal-${{ needs.build.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: PawSignal v${{ needs.build.outputs.version }}
          body: |
            ## PawSignal v${{ needs.build.outputs.version }}

            > macOS 菜单栏红绿灯 —— 实时监控 Claude Code 和 CatPaw Agent 的工作状态

            ### 🆕 v2.2.2 更新内容

            #### ⚡ 性能优化
            - **磁盘 I/O 大幅降低**：每次轮询（0.3s）从原来的 5–6 次磁盘读减少到 1 次，新增 `_refresh_tick_cache()` 在 tick 开始时统一读取所有 `.state` 文件，后续所有计算复用缓存
            - **挂件 JS 推送去重**：`_push_state_to_widget` 缓存上次推送内容，状态无变化时跳过 `evaluateJavaScript`，绿灯静默时 WebView 零通信
            - **拖拽写盘节流**：挂件拖动时不再每帧写文件，仅在 `mouseUp`（松手）时保存一次位置

            #### 🐛 逻辑修复
            - **stats 缓存**：`daily_stats.json` 结果缓存在内存，Token 扫描线程完成后主动刷新缓存并强制触发一次挂件更新，避免重复读盘
            - **修复 mode_items 缩进错乱**：代码格式修正

            <details>
            <summary>📦 历史版本亮点</summary>

            **v2.2.1**
            - 📋 Claude 项目列表改为只读展示，显示各项目实时灯色
            - 🧹 移除无用的项目切换逻辑

            **v2.2.0**
            - ✅ 多项目同时监听（所有 Claude 项目全量监控）
            - 📊 今日 Claude Token 统计
            - 🐛 修复退出后统计清零
            - 🔄 修复日志轮转导致监听中断
            - 🍎 Apple Silicon 原生打包
            </details>

            ### 安装说明

            **方式一：下载 DMG 安装包（推荐）**
            1. 下载 `PawSignal-${{ needs.build.outputs.version }}.dmg`
            2. 双击打开 DMG，将 **PawSignal.app** 拖入「应用程序」文件夹
            3. 启动应用

            **方式二：直接下载 .app**
            1. 下载 `PawSignal.app.zip`
            2. 解压后将 `PawSignal.app` 拖入「应用程序」文件夹
            3. 双击启动

            ### 系统要求

            - macOS（Apple Silicon，M1/M2/M3/M4）

            ### ⚠️ macOS 安全提示（"无法验证开发者"）

            首次打开时，macOS 可能会弹出 **"无法验证开发者"** 或 **"Apple 无法检查是否包含恶意软件"** 的提示，这是正常的——因为此应用未经 Apple 公证（Notarization）。

            **解决方法：** 打开终端执行以下命令后重新双击启动：
            ```bash
            xattr -cr /Applications/PawSignal.app
            ```
          files: |
            PawSignal.app.zip
            PawSignal-${{ needs.build.outputs.version }}.dmg
          draft: false
          prerelease: false
